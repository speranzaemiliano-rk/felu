<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felu · Estrella de Maldonado</title>
<meta name="description" content="Felu, jugador de futsal de Estrella de Maldonado. Todos sus videos, temporada por temporada.">
<meta property="og:title" content="Felu · Estrella de Maldonado">
<meta property="og:description" content="Todos los videos de Felu, temporada por temporada.">
<meta property="og:image" content="https://i.ytimg.com/vi/IWbZp_nwXhU/maxresdefault.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Felu 10">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d99a00' d='M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: portada con video de fondo a todo el ancho, debajo el último video y las temporadas en grilla */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --fg:#0f1d2b; --muted:#566778;
  --court:#1f6fb2; --line:#d7e1ea; --star:#d99a00; --on-court:#ffffff;
  --ink:#0b1520;                       /* fondo de la portada (no cambia con el tema) */
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --press:100ms;                       /* respuesta al apretar: inmediata */
  --ease-out:cubic-bezier(.22,1,.36,1);/* desaceleración tipo resorte sin rebote */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1520; --surface:#122232; --fg:#e8eef4; --muted:#93a6b8;
  --court:#2b86d1; --line:#22384c; --star:#f2b928; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1520; --surface:#122232; --fg:#e8eef4; --muted:#93a6b8;
  --court:#2b86d1; --line:#22384c; --star:#f2b928; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--star);outline-offset:3px;border-radius:8px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---------- Portada ---------- */
/* El video se muestra completo (16:9, sin recortes): el texto va encima en pantallas anchas y debajo en el celular */
.hero{position:relative;background:var(--ink);color:var(--on-court)}
.media{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--ink)}
.hero .fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.media::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(8,18,30,.92) 0%,rgba(8,18,30,.5) 30%,rgba(8,18,30,0) 60%)}
.hero .wrap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-block:40px 44px}
.club{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.8125rem}
.club svg{width:20px;height:20px;fill:var(--star)}
/* Texto grande: interlineado apretado y tracking negativo; el chico, positivo */
h1{font-family:var(--display);font-weight:900;font-size:clamp(4.5rem,13vw,9.25rem);line-height:.85;margin:14px 0 10px;letter-spacing:-.01em;text-transform:uppercase}
h1 .num{color:var(--star);font-size:.62em;margin-left:.18em;vertical-align:.42em;letter-spacing:-.02em}
.bajada{font-size:1.125rem;max-width:34ch;margin:0;font-weight:500}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.datos li{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 12px;font-size:.875rem;font-weight:500;letter-spacing:.01em;
  background:rgba(8,18,30,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.datos li.pend{border-style:dashed;opacity:.8}

/* Botón de pausa: material translúcido sobre el video, zona táctil de 44px */
.pausa{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));right:16px;width:44px;height:44px;display:grid;place-items:center;padding:0;cursor:pointer;
  border-radius:50%;border:1px solid rgba(255,255,255,.35);color:#fff;
  background:rgba(8,18,30,.4);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  transition:transform var(--press) ease-out,background-color .2s}
.instalar{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));left:16px;height:44px;padding:0 18px;cursor:pointer;
  border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;font:600 .875rem/1 var(--body);letter-spacing:.01em;
  background:rgba(8,18,30,.4);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  transition:transform var(--press) ease-out,background-color .2s}
.instalar:active{transform:scale(.95)}
.pausa svg{width:16px;height:16px;fill:currentColor}
.pausa:active{transform:scale(.92)}

/* ---------- Videos ---------- */
main{padding-block:48px 24px}
.ultimo{max-width:820px;margin:0 auto 48px}
.cabecera{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
h2{font-family:var(--display);font-weight:900;font-size:2.75rem;line-height:1;text-transform:uppercase;margin:0;letter-spacing:-.005em;text-wrap:balance}
.canal{font-weight:600;color:var(--court);text-decoration:none;border-bottom:2px solid currentColor}
.temporada{margin-top:34px}
.temporada h3{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:900;font-size:1.875rem;line-height:1;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.temporada h3 span{font-family:var(--body);font-weight:600;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 18px}

/* Tarjeta de video: responde al apretar (no al soltar) */
.clip,.destacado{all:unset;box-sizing:border-box;width:100%;min-width:0;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:transform var(--press) ease-out}
button.clip:active,button.destacado:active{transform:scale(.97)}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:10px;background:#000}
.destacado .thumb{border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease-out)}
.play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(10,20,30,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);
  transition:background-color .2s,transform .3s var(--ease-out)}
.play::after{content:"";position:absolute;left:22px;top:17px;border-style:solid;border-width:11px 0 11px 17px;border-color:transparent transparent transparent #fff}
.clip .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.clip .play::after{left:17px;top:13px;border-width:9px 0 9px 14px}
/* Hover sólo donde hay mouse: en el celular quedaría "pegado" después de tocar */
@media (hover:hover){
  button:hover .thumb img{transform:scale(1.04)}
  button:hover .play{background:var(--star);transform:scale(1.06)}
  .pausa:hover,.instalar:hover{background:rgba(8,18,30,.6)}
  .yt:hover{text-decoration:underline}
}
/* El reproductor aparece como material, no de golpe */
/* Si el celular no deja arrancar el video solo, se muestra un botón de play grande */
.media .play{display:none;z-index:2;cursor:pointer;pointer-events:none}
.media.quieto .play{display:block}
.media.quieto{cursor:pointer}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(.985);
  transition:opacity .35s var(--ease-out),transform .45s var(--ease-out)}
.thumb iframe.listo{opacity:1;transform:none}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:4px;font-size:.9375rem}
.cap b{font-family:var(--display);font-size:1.5rem;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.875rem}
.meta .n{font-weight:600}
.meta .f,.cap span{color:var(--muted);font-variant-numeric:tabular-nums}
.yt{display:inline-block;padding-block:4px;font-size:.8125rem;color:var(--muted);text-decoration:none}

footer{border-top:2px solid var(--line);margin-top:40px}
footer .wrap{padding-block:22px 32px;color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:760px){
  .media::after{background:linear-gradient(0deg,rgba(8,18,30,.7) 0%,rgba(8,18,30,0) 35%)}
  .hero .wrap{position:static;padding-block:20px 32px}
  h1{margin-top:10px}
  h2{font-size:2.25rem}
  .wrap{padding-inline:16px}
}
/* ---------- Barra de temporadas: material translúcido que queda fija al bajar ---------- */
html{scroll-behavior:smooth}
.barra{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
/* Borde de scroll: un fundido suave en vez de una línea dura */
.barra::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 60%,transparent),transparent)}
.barra-in{display:flex;align-items:center;gap:14px;min-height:56px}
.marca{flex:none;font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1;letter-spacing:-.01em;text-transform:uppercase;text-decoration:none;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .3s var(--ease-out),transform .4s var(--ease-out)}
.marca b{color:var(--star);font-size:.75em;margin-left:.12em;vertical-align:.25em}
.barra.fija .marca{opacity:1;transform:none;pointer-events:auto}
.chips{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding-block:8px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;text-decoration:none;
  font-weight:600;font-size:.875rem;letter-spacing:.01em;color:var(--fg);font-variant-numeric:tabular-nums;
  transition:transform var(--press) ease-out,background-color .25s,color .25s}
.chips a[aria-current="true"]{background:var(--fg);color:var(--bg)}
.chips a:active{transform:scale(.95)}
#ultimo,.temporada{scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
/* Links: respuesta al tocar */
.canal,.yt,.marca{transition:opacity var(--press) ease-out}
.canal:active,.yt:active{opacity:.55}
@media (hover:hover){.chips a:not([aria-current="true"]):hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}}
@media (max-width:760px){.marca{font-size:1.25rem}.chips{margin-left:0}.barra.fija .chips{margin-left:auto}}
/* Más contraste: superficies sólidas y bordes definidos */
@media (prefers-contrast:more){
  :root{--muted:var(--fg)}
  .barra{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:2px solid var(--fg)}
  .barra::after{display:none}
  .chips a{border:1px solid var(--fg)}
  .pausa,.instalar,.play,.datos li{-webkit-backdrop-filter:none;backdrop-filter:none;background:#0b1520;border-color:#fff}
}
/* Menos movimiento: el video no arranca solo (lo maneja el JS) y sin zoom; sólo fundidos */
@media (prefers-reduced-motion:reduce){
  .clip,.destacado,.thumb img,.play,.pausa{transition:none}
  button.clip:active,button.destacado:active,button:hover .thumb img,button:hover .play{transform:none}
  .thumb iframe{transform:none;transition:opacity .2s linear}
  html{scroll-behavior:auto}
  .marca{transform:none;transition:opacity .2s linear}
}
/* Menos transparencia: superficies sólidas */
@media (prefers-reduced-transparency:reduce){
  .pausa,.instalar,.play,.datos li{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(8,18,30,.85)}
  .barra{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<header class="hero" id="arriba">
  <div class="media">
  <video class="fondo" muted loop playsinline preload="metadata" poster="portada.jpg" aria-hidden="true"></video>
  <span class="play" aria-hidden="true"></span>
  <button type="button" class="pausa" id="pausa" aria-label="Pausar el video de fondo"></button>
  <button type="button" class="instalar" id="instalar" hidden>Instalar app</button>
  </div>
  <div class="wrap">
    <div>
      <div class="club"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg><span id="club"></span></div>
      <h1 id="nombre"></h1>
      <p class="bajada" id="bajada"></p>
      <ul class="datos" id="datos"></ul>
    </div>
  </div>
</header>

<nav class="barra" id="barra" aria-label="Ir a">
  <div class="wrap barra-in">
    <a class="marca" id="marca" href="#arriba" aria-label="Volver arriba"></a>
    <div class="chips" id="chips"></div>
  </div>
</nav>

<main class="wrap">
  <section class="ultimo" id="ultimo" aria-label="Último video"><div id="destacado"></div></section>
  <div class="cabecera">
    <h2>Todos los videos</h2>
    <a class="canal" id="canal" target="_blank" rel="noopener">Ver el canal en YouTube ↗</a>
  </div>
  <div id="temporadas"></div>
</main>

<footer>
  <div class="wrap">
    <span id="pie"></span>
    <span>Videos de YouTube</span>
  </div>
</footer>

<script>
// ===================================================================
//  DATOS DE LA PÁGINA — esto es lo único que hace falta editar.
// ===================================================================
var JUGADOR = {
  nombre: 'Felu',
  club: 'Estrella de Maldonado',
  bajada: 'Futsal. Sus partidos, jugadas y goles desde 2023, temporada por temporada.',
  numero: '10',          // se muestra grande al lado del nombre
  canal: 'https://www.youtube.com/@pepy1983',
  // Si un dato queda vacío ('') se muestra como «a completar».
  datos: [
    { etiqueta: 'Deporte',   valor: 'Futsal' },
    { etiqueta: 'Posición',  valor: 'Centro' },
    { etiqueta: 'Categoría', valor: '2016' },
    { etiqueta: 'Camiseta',  valor: '10' }
  ]
};

// Un video por línea. Para agregar uno nuevo: copiá una línea, poné el id
// (lo que va después de «watch?v=» en el link de YouTube), la fecha y el título.
// El primero de la lista es el que se muestra grande arriba.
var VIDEOS = [
  { id: 'IWbZp_nwXhU', fecha: '2026-05-21', titulo: 'Video 18' },
  { id: 'VoGP9lWb4pU', fecha: '2025-11-25', titulo: 'Video 17' },
  { id: 'L1U4P-TSmxI', fecha: '2025-11-18', titulo: 'Video 16' },
  { id: '8r2OWSzCKhs', fecha: '2024-03-11', titulo: 'Video 15' },
  { id: 'Y5TyzuG6x4M', fecha: '2024-01-26', titulo: 'Video 15' },
  { id: 'groMKiT46UI', fecha: '2023-11-27', titulo: 'Video 14' },
  { id: 'pDI4ZBcxYu0', fecha: '2023-08-15', titulo: 'Video 13' },
  { id: 'vGG2kiiTfkw', fecha: '2023-06-13', titulo: 'Video 12' },
  { id: 'ZHtzInHGIUI', fecha: '2023-06-12', titulo: 'Video 10' },
  { id: 'yA_MC8yUrW4', fecha: '2023-06-10', titulo: 'Video 11' },
  { id: '78ypRi7Ast8', fecha: '2023-05-12', titulo: 'Video 9' },
  { id: 'e1uDWESQAI4', fecha: '2023-05-12', titulo: 'Video 8' },
  { id: 'W0-kxhYURx0', fecha: '2023-05-11', titulo: 'Video 7' },
  { id: 'W8nZwqz86Hs', fecha: '2023-05-11', titulo: 'Video 6' },
  { id: 'O0JaTnPbIOY', fecha: '2023-05-11', titulo: 'Video 5' }
];

// ===================================================================
//  De acá para abajo arma la página con los datos de arriba.
// ===================================================================
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fechaLinda(f) {
  var p = f.split('-');
  return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1] + ' ' + p[0];
}

// Muestra la miniatura; el reproductor de YouTube recién se carga al tocarla.
function tarjeta(v, grande) {
  var img = 'https://i.ytimg.com/vi/' + v.id + (grande ? '/maxresdefault.jpg' : '/mqdefault.jpg');
  var link = 'https://www.youtube.com/watch?v=' + v.id;
  return '<div class="' + (grande ? 'destacado-box' : 'clip-box') + '">' +
    '<button type="button" class="' + (grande ? 'destacado' : 'clip') + '" data-id="' + esc(v.id) + '" aria-label="Reproducir ' + esc(v.titulo) + '">' +
      '<span class="thumb"><img src="' + img + '" alt="' + esc(v.titulo) + '" loading="lazy" width="' + (grande ? 1280 : 320) + '" height="' + (grande ? 720 : 180) + '"><span class="play" aria-hidden="true"></span></span>' +
      (grande
        ? '<span class="cap"><b>Último video · ' + esc(v.titulo) + '</b><span>' + fechaLinda(v.fecha) + '</span></span>'
        : '<span class="meta"><span class="n">' + esc(v.titulo) + '</span><span class="f">' + fechaLinda(v.fecha) + '</span></span>') +
    '</button>' +
    '<a class="yt" href="' + link + '" target="_blank" rel="noopener">Abrir en YouTube ↗</a>' +
  '</div>';
}

function reproducir(btn) {
  var thumb = btn.querySelector('.thumb');
  var id = btn.getAttribute('data-id');
  thumb.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
    '?autoplay=1&rel=0" title="Video" onload="this.classList.add(\'listo\')" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  // Ya no es un botón: el reproductor maneja los clics.
  var div = document.createElement('div');
  div.className = btn.className;
  while (btn.firstChild) div.appendChild(btn.firstChild);
  btn.parentNode.replaceChild(div, btn);
}

function armar() {
  document.getElementById('nombre').innerHTML = esc(JUGADOR.nombre) +
    (JUGADOR.numero ? '<span class="num">' + esc(JUGADOR.numero) + '</span>' : '');
  document.getElementById('club').textContent = JUGADOR.club;
  document.getElementById('bajada').textContent = JUGADOR.bajada;
  document.getElementById('canal').href = JUGADOR.canal;
  document.getElementById('pie').textContent = JUGADOR.nombre + ' · ' + JUGADOR.club;

  document.getElementById('datos').innerHTML = JUGADOR.datos.map(function (d) {
    return d.valor
      ? '<li>' + esc(d.etiqueta === 'Deporte' ? d.valor : d.etiqueta + ': ' + d.valor) + '</li>'
      : '<li class="pend">' + esc(d.etiqueta) + ': a completar</li>';
  }).join('');

  if (!VIDEOS.length) return;
  document.getElementById('destacado').innerHTML = tarjeta(VIDEOS[0], true);

  // El resto, agrupado por año (el más nuevo primero).
  var porAnio = {};
  VIDEOS.slice(1).forEach(function (v) {
    var a = v.fecha.slice(0, 4);
    (porAnio[a] = porAnio[a] || []).push(v);
  });
  document.getElementById('temporadas').innerHTML = Object.keys(porAnio).sort().reverse().map(function (a) {
    return '<section class="temporada" id="t' + a + '"><h3><span>Temporada</span> ' + a + '</h3>' +
      '<div class="grid">' + porAnio[a].map(function (v) { return tarjeta(v, false); }).join('') + '</div></section>';
  }).join('');

  // Barra: un chip por temporada, marca cuál se está viendo y muestra el nombre al pasar la portada.
  var anios = Object.keys(porAnio).sort().reverse();
  var chips = document.getElementById('chips');
  chips.innerHTML = '<a href="#ultimo">Último</a>' + anios.map(function (a) { return '<a href="#t' + a + '">' + a + '</a>'; }).join('');
  document.getElementById('marca').innerHTML = esc(JUGADOR.nombre) + (JUGADOR.numero ? '<b>' + esc(JUGADOR.numero) + '</b>' : '');
  if ('IntersectionObserver' in window) {
    var barra = document.getElementById('barra');
    new IntersectionObserver(function (en) {
      barra.classList.toggle('fija', !en[0].isIntersecting);
    }, { rootMargin: '-60px 0px 0px 0px' }).observe(document.getElementById('arriba'));

    var marcar = function (id) {
      Array.prototype.forEach.call(chips.children, function (c) {
        var on = c.getAttribute('href') === '#' + id;
        if (on) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
        // En el celular, que el chip activo quede a la vista dentro de la fila
        if (on && chips.scrollWidth > chips.clientWidth) {
          chips.scrollTo({ left: c.offsetLeft - 16, behavior: reducirMov ? 'auto' : 'smooth' });
        }
      });
    };
    var reducirMov = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var secciones = [document.getElementById('ultimo')].concat(anios.map(function (a) { return document.getElementById('t' + a); }));
    // Activa = la última sección cuyo título ya pasó por debajo de la barra.
    var actual = null, pendiente = false;
    var revisar = function () {
      pendiente = false;
      var limite = barra.getBoundingClientRect().bottom + 24, id = secciones[0].id;
      secciones.forEach(function (s) { if (s.getBoundingClientRect().top <= limite) id = s.id; });
      if (id !== actual) { actual = id; marcar(id); }
    };
    window.addEventListener('scroll', function () {
      if (!pendiente) { pendiente = true; requestAnimationFrame(revisar); }
    }, { passive: true });
    revisar();
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-id]');
    if (btn) reproducir(btn);
  });

  // Video de fondo: botón de pausa y se frena solo cuando no se ve (ahorra batería).
  var vid = document.querySelector('.hero .fondo');
  var pausa = document.getElementById('pausa');
  var ICONO = {
    pausa: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>',
    play:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/></svg>'
  };
  var media = document.querySelector('.media');
  var pausadoAMano = false;
  var bloqueado = false;   // el navegador no lo dejó arrancar solo
  var reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // En el celular, un archivo más liviano (carga antes y gasta menos datos).
  vid.muted = true;  // iOS y Android sólo dejan arrancar solos los videos sin sonido
  // Si el navegador no reproduce MP4, usa la copia en WebM.
  var mp4 = vid.canPlayType('video/mp4; codecs="avc1.4d401f"');
  vid.src = !mp4 ? 'portada.webm'
    : window.matchMedia('(max-width: 760px)').matches ? 'portada-movil.mp4' : 'portada.mp4';

  function pintarPausa() {
    pausa.innerHTML = vid.paused ? ICONO.play : ICONO.pausa;
    pausa.setAttribute('aria-label', vid.paused ? 'Reproducir el video de fondo' : 'Pausar el video de fondo');
    media.classList.toggle('quieto', vid.paused && bloqueado);
  }
  function arrancar() {
    var pr = vid.play();
    // Si el celular lo bloquea (ahorro de batería, ahorro de datos), queda el play grande.
    if (pr && pr.catch) pr.catch(function () { bloqueado = true; pintarPausa(); });
  }
  // 'click' y no 'pointerdown': en el celular sólo el toque completo cuenta como gesto
  // del usuario, y sin gesto el navegador no deja arrancar el video.
  pausa.addEventListener('click', function (e) {
    e.stopPropagation();
    if (vid.paused) { pausadoAMano = false; arrancar(); }
    else { pausadoAMano = true; vid.pause(); }
  });
  // Tocar el video cuando está quieto también lo arranca.
  media.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    if (vid.paused) { pausadoAMano = false; arrancar(); }
  });
  vid.addEventListener('play', function () { bloqueado = false; pintarPausa(); });
  vid.addEventListener('pause', pintarPausa);
  pintarPausa();

  if (reducir) {
    pausadoAMano = true;   // con «reducir movimiento» no arranca solo, pero se puede tocar play
    bloqueado = true;
    pintarPausa();
  } else {
    arrancar();
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entradas) {
      if (pausadoAMano) return;
      if (entradas[0].isIntersecting) arrancar(); else vid.pause();
    }, { threshold: 0.15 }).observe(vid);
  }

  // En iOS, :active sólo se activa si hay algún listener de toque.
  document.addEventListener('touchstart', function () {}, { passive: true });

  // App instalable: el botón aparece sólo cuando el navegador ofrece instalarla.
  var btnInstalar = document.getElementById('instalar');
  var pedido = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    pedido = e;
    btnInstalar.hidden = false;
  });
  btnInstalar.addEventListener('click', function () {
    if (!pedido) return;
    pedido.prompt();
    pedido.userChoice.finally(function () { pedido = null; btnInstalar.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btnInstalar.hidden = true; });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
}

armar();
</script>
</body>
</html>
